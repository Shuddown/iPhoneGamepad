name: iPhoneGamepad
options:
  bundleIdPrefix: com.shudhesh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  iPhoneGamepad:
    type: application
    platform: iOS
    sources:
      - path: iPhoneGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shudhesh.iphonegamepad
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iPhoneGamepad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  iPhoneGamepad:
    build:
      targets:
        iPhoneGamepad: all
    run:
      config: Debug
    archive:
      config: Release
